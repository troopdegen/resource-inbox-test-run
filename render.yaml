# Render Blueprint — Resource Inbox landing page
#
# Static site. The deploy from this manifest is opt-in (autoDeploy: false),
# matching the workshop's "trigger the deployment with render deploys command"
# convention. To bootstrap with this Blueprint, run:
#
#   render blueprints validate   # → ./render.yaml (default)
#   render blueprints apply      # (interactive; prints URL after apply)
#
# This file is committed to the repo for reproducibility. The live deployment
# was created via the Render CLI; this manifest mirrors that configuration.

services:
  - type: web
    runtime: static
    name: resource-inbox-test-run
    repo: https://github.com/troopdegen/resource-inbox-test-run
    branch: main
    buildCommand: npm run build
    staticPublishPath: ./dist
    autoDeploy: false
